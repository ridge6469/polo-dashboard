<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://notes.fuckingclaude.top:8446; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Polo 账号用量看板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" class="login" hidden>
  <form id="login-form" class="card login-card" autocomplete="on">
    <h1>Polo 账号用量看板</h1>
    <p class="muted">请输入看板密码。数据保存在你的服务器上，未登录无法读取。</p>
    <input type="text" name="username" value="polo-dashboard" autocomplete="username" hidden>
    <label for="password">看板密码</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="login-btn">登录</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</section>

<main id="app" hidden>
  <header class="topbar">
    <div>
      <h1>Polo 账号用量看板</h1>
      <p id="updated" class="muted"></p>
    </div>
    <div class="actions">
      <button id="refresh-btn" type="button">刷新</button>
      <button id="logout-btn" type="button" class="secondary">退出</button>
    </div>
  </header>
  <p id="notice" class="notice" hidden></p>

  <section id="summary" class="cards"></section>

  <section class="card">
    <div class="section-head">
      <h2>账号额度</h2>
      <p id="account-stats" class="muted"></p>
    </div>
    <p class="muted small">百分比为后台页面显示的已用比例；“—”表示页面未显示或无法读取，不代表 0。点击表头可排序。</p>
    <div class="table-wrap"><table id="accounts"></table></div>
  </section>

  <section class="grid2">
    <div class="card"><h2>用量（当前窗口）</h2><div id="usage"></div></div>
    <div class="card"><h2>代理健康</h2><div id="proxies"></div></div>
    <div class="card"><h2>已归档账号</h2><div id="archived"></div></div>
    <div class="card"><h2>用量统计</h2><div id="vendor"></div></div>
  </section>
  <footer class="muted small">服务器约每 10 分钟采集一次；本页打开时每 5 分钟自动读取最新结果，不会触发后台刷新。</footer>
</main>
<script src="app.js"></script>
</body>
</html>
